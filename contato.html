    <main class="container-contato">
        <h1>► Entre em Contato</h1>

        <form class="formulario-contato" action="#" method="post">
            <fieldset>
                <legend>Envie sua mensagem ou sugestão de banda</legend>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto" required>
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="duvida">Dúvida</option>
                        <option value="sugestao">Sugestão</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
                </div>
            </fieldset>

            <button type="submit" class="botao-enviar">Enviar mensagem</button>
        </form>

        <p class="link-interno">Voltar para <a href="index.html">as bandas brasileiras de punk rock e crossover thrash em destaque</a>.</p>
    </main>
